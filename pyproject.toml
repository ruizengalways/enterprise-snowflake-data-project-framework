[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-snowflake-data-project-framework"
version = "0.17.0"
description = "Snowflake domain pipeline scaffolding with apply-once migrations, fail-closed DDL, grant-preserving releases, reviewed RAW contracts, quality evidence, SLA/repair and enterprise health guardrails"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  "ruamel.yaml>=0.18,<0.19",
]

[project.scripts]
esf = "enterprise_snowflake_framework.cli:main"
esf-control-preflight = "enterprise_snowflake_framework.deployment_preflight:main"
esf-migrate = "enterprise_snowflake_framework.migration_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enterprise_snowflake_framework = [
  "schemas/*.json",
  "templates/*/*.md",
  "templates/*/*.sql",
  "templates/project/*.md",
  "templates/project/*.yml",
  "templates/project/*.txt",
  "templates/project/*.sql",
]
