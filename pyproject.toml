[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-snowflake-data-project-framework"
version = "0.4.0"
description = "Append-only project scaffolding, domain control-plane foundations and CI guardrails for Enterprise Snowflake data projects"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.scripts]
esf = "enterprise_snowflake_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enterprise_snowflake_framework = [
  "schemas/*.json",
  "templates/*/*.md",
  "templates/*/*.sql",
  "templates/project/*.md",
  "templates/project/*.yml",
  "templates/project/*.txt",
  "templates/project/*.sql",
]
