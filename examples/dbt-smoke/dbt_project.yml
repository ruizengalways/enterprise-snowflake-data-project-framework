name: esf_dbt_smoke
version: 1.0.0
config-version: 2
profile: esf_dbt_smoke

model-paths:
  - models
macro-paths:
  - macros

vars:
  esf_datasets:
    smoke_full_refresh:
      id: smoke_full_refresh
      load_strategy: full_refresh
      implementation: standard
    smoke_append_only:
      id: smoke_append_only
      load_strategy: append_only
      implementation: standard
    smoke_incremental_merge:
      id: smoke_incremental_merge
      load_strategy: incremental_merge
      implementation: standard
      business_key:
        - id
    smoke_scd2:
      id: smoke_scd2
      load_strategy: scd2_merge
      implementation: standard
      business_key:
        - id
      scd2:
        effective_at_column: effective_at
        order_columns:
          - effective_at
          - source_sequence
        tracked_columns:
          - status
          - depot_id
        operation_column: source_operation
        delete_values:
          - D
        late_arriving_policy: rebuild_affected_keys

models:
  esf_dbt_smoke:
    staging:
      +schema: STAGING
