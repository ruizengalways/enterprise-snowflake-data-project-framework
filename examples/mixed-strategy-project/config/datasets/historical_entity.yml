schema_version: 2

dataset:
  id: historical_entity
  owner_team: example-data
  raw_contract: contracts/raw/source_entity.yml
  load:
    strategy: scd2
    business_key:
      - entity_id
    watermark_column: source_updated_at
    scd2:
      effective_at_column: source_updated_at
      order_columns:
        - source_updated_at
        - source_sequence
      tracked_columns:
        - value
      delete:
        operation_column: source_operation
        values:
          - D
      late_arrival:
        strategy: rebuild_affected_keys
  materialization:
    type: table
  runtime:
    mode: dbt
  compute:
    workload: transform
  quality:
    freshness:
      warn_after_minutes: 15
      error_after_minutes: 60
    reconciliation:
      enabled: true
