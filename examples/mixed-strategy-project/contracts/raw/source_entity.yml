schema_version: 2
contract:
  source_system: example_source
  entity: source_entity
  grain: one row per source entity change
  business_key:
    - entity_id
  source_timestamp: source_updated_at
  columns:
    - name: entity_id
      type: VARCHAR
      nullable: false
      classification: internal
    - name: value
      type: VARCHAR
      nullable: true
      classification: internal
    - name: source_updated_at
      type: TIMESTAMP_NTZ
      nullable: false
      classification: internal
    - name: source_operation
      type: VARCHAR
      nullable: false
      classification: internal
    - name: source_sequence
      type: NUMBER
      nullable: false
      classification: internal
    - name: ingested_at
      type: TIMESTAMP_NTZ
      nullable: false
      classification: internal
  change_semantics:
    mode: cdc
    operation_column: source_operation
    sequence_column: source_sequence
    delete_semantics: tombstone
    delete_values:
      - D
  capture_fidelity: full_change
  ordering_columns:
    - source_updated_at
    - source_sequence
  idempotency_key:
    - entity_id
    - source_sequence
  breaking_change_policy: versioned_contract
