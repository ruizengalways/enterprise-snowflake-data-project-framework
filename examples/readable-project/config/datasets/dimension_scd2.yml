schema_version: 2
dataset:
  id: dimension_scd2
  owner_team: example-data
  raw_contract: contracts/raw/source_entity.yml
  load:
    strategy: scd2
    execution:
      mode: dbt_batch
    business_key:
      - entity_id
    watermark_column: source_updated_at
    scd2:
      effective_at_column: source_updated_at
      order_columns:
        - source_updated_at
        - source_sequence
      tracked_columns:
        - value
      operation_column: source_operation
      delete_values:
        - D
      late_arriving_policy: rebuild_affected_keys
  freshness:
    warn_after_minutes: 30
    error_after_minutes: 120
  reconciliation:
    enabled: true
    measures:
      - row_count
      - distinct_business_key
      - min_max_source_timestamp
