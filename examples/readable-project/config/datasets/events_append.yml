schema_version: 2
dataset:
  id: events_append
  owner_team: example-data
  raw_contract: contracts/raw/source_entity.yml
  load:
    strategy: append_only
    execution:
      mode: dbt_batch
  freshness:
    warn_after_minutes: 15
    error_after_minutes: 60
  reconciliation:
    enabled: true
    measures:
      - row_count
