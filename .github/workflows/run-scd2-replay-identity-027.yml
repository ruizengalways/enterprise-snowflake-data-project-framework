name: One-time SCD2 replay identity patch

on:
  push:
    branches: [fix/scd2-replay-event-identity]
    paths: [.github/workflows/run-scd2-replay-identity-027.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/scd2-replay-event-identity
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install .
      - name: Patch and verify replay contract
        run: |
          set -euo pipefail
          python tools/patch_scd2_replay_identity_027.py
          python -m py_compile src/enterprise_snowflake_framework/pipeline_replay.py
          PYTHONPATH=src python -m unittest tests.test_input_idempotency -v
      - name: Commit source change only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/enterprise_snowflake_framework/pipeline_replay.py
          git commit -m "fix: preserve retained tombstone replay identity"
          git push origin HEAD:fix/scd2-replay-event-identity
