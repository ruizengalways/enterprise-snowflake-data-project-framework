name: Reusable Silver-first Project Deploy

on:
  workflow_call:
    inputs:
      project_code:
        description: "Uppercase domain/project code, for example HEALTH."
        required: true
        type: string
      environment:
        description: "Target Snowflake environment: dev, uat, or prod."
        required: true
        type: string
      git_sha:
        description: "Immutable 40-character project Git commit SHA from main history to deploy."
        required: true
        type: string
      framework_ref:
        description: "Immutable toolkit Git commit SHA used for contract validation and shared workflow code."
        required: true
        type: string
      project_dir:
        description: "dbt project directory inside the calling repository."
        required: false
        default: dbt
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.project_code }} ${{ inputs.git_sha }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ESF_ENVIRONMENT: ${{ inputs.environment }}
      DBT_AUTHENTICATOR: workload_identity
      DBT_DEFAULT_SCHEMA: GOLD_MARTS
      SNOWFLAKE_ENHANCED_EXIT_CODES: "1"
    steps:
      - name: Validate immutable deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.project_code }}" =~ ^[A-Z][A-Z0-9_]{1,31}$ ]]
          [[ "${{ inputs.environment }}" =~ ^(dev|uat|prod)$ ]]
          [[ "${{ inputs.git_sha }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.framework_ref }}" =~ ^[0-9a-f]{40}$ ]]

      - name: Load approved Snowflake environment configuration
        shell: bash
        env:
          ESF_SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          ESF_SNOWFLAKE_OIDC_AUDIENCE: ${{ vars.SNOWFLAKE_OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          if [[ -z "${ESF_SNOWFLAKE_ACCOUNT:-}" || -z "${ESF_SNOWFLAKE_OIDC_AUDIENCE:-}" ]]; then
            echo "GitHub Environment ${{ inputs.environment }} must define SNOWFLAKE_ACCOUNT and SNOWFLAKE_OIDC_AUDIENCE." >&2
            exit 1
          fi
          [[ "${ESF_SNOWFLAKE_OIDC_AUDIENCE}" != "snowflakecomputing.com" ]]
          echo "SNOWFLAKE_ACCOUNT=${ESF_SNOWFLAKE_ACCOUNT}" >> "${GITHUB_ENV}"
          echo "SNOWFLAKE_OIDC_AUDIENCE=${ESF_SNOWFLAKE_OIDC_AUDIENCE}" >> "${GITHUB_ENV}"

      - name: Checkout project main history
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: project

      - name: Verify and checkout immutable project revision
        shell: bash
        run: |
          set -euo pipefail
          requested_sha="${{ inputs.git_sha }}"
          git -C project cat-file -e "${requested_sha}^{commit}"
          if ! git -C project merge-base --is-ancestor "${requested_sha}" HEAD; then
            echo "git_sha must be reachable from current main history." >&2
            exit 1
          fi
          git -C project checkout --detach "${requested_sha}"
          [[ "$(git -C project rev-parse HEAD)" == "${requested_sha}" ]]

      - name: Checkout immutable toolkit revision
        uses: actions/checkout@v7.0.1
        with:
          repository: ruizengalways/enterprise-snowflake-data-project-framework
          ref: ${{ inputs.framework_ref }}
          persist-credentials: false
          path: framework

      - name: Verify toolkit revision
        run: '[[ "$(git -C framework rev-parse HEAD)" == "${{ inputs.framework_ref }}" ]]'
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: framework/requirements-dbt.txt

      - name: Install toolkit, dbt and Snowflake CLI
        run: |
          python -m pip install -r framework/requirements-dbt.txt
          python -m pip install ./framework
          python -m pip install "snowflake-cli==3.23.0"

      - name: Validate project contracts before authentication
        run: esf validate --project-root project

      - name: Validate committed domain control-plane deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="project/control_plane/deploy_manifest.txt"
          if [[ ! -f "${manifest}" ]]; then
            echo "No domain control-plane manifest found; skipping control-plane deployment for this project revision."
            exit 0
          fi
          count=0
          while IFS= read -r raw || [[ -n "${raw}" ]]; do
            path="${raw%%#*}"
            path="$(printf '%s' "${path}" | xargs)"
            [[ -z "${path}" ]] && continue
            if [[ "${path}" == /* || "${path}" == *".."* || ! "${path}" =~ ^control_plane/[A-Za-z0-9_/-]+\.sql$ ]]; then
              echo "Unsafe control-plane deployment path: ${path}" >&2
              exit 1
            fi
            test -f "project/${path}"
            count=$((count + 1))
          done < "${manifest}"
          [[ ${count} -gt 0 ]]

      - name: Validate committed Silver deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="project/silver_processing/deploy_manifest.txt"
          test -f "${manifest}"
          count=0
          while IFS= read -r raw || [[ -n "${raw}" ]]; do
            path="${raw%%#*}"
            path="$(printf '%s' "${path}" | xargs)"
            [[ -z "${path}" ]] && continue
            if [[ "${path}" == /* || "${path}" == *".."* || ! "${path}" =~ ^silver_processing/[A-Za-z0-9_/-]+\.sql$ ]]; then
              echo "Unsafe Silver deployment path: ${path}" >&2
              exit 1
            fi
            test -f "project/${path}"
            count=$((count + 1))
          done < "${manifest}"
          [[ ${count} -gt 0 ]]

      - name: Resolve deployment identity and physical targets
        shell: bash
        run: |
          set -euo pipefail
          env_upper="$(printf '%s' "${{ inputs.environment }}" | tr '[:lower:]' '[:upper:]')"
          echo "SNOWFLAKE_USER=SU_GITHUB_${{ inputs.project_code }}_DEPLOY" >> "${GITHUB_ENV}"
          echo "SNOWFLAKE_ROLE=AR_${{ inputs.project_code }}_DEPLOY" >> "${GITHUB_ENV}"
          echo "SNOWFLAKE_WAREHOUSE=WH_${{ inputs.project_code }}_TRANSFORM" >> "${GITHUB_ENV}"
          echo "SNOWFLAKE_DATABASE=${env_upper}_${{ inputs.project_code }}" >> "${GITHUB_ENV}"
          echo "DBT_ROLE=AR_${{ inputs.project_code }}_DEPLOY" >> "${GITHUB_ENV}"
          echo "DBT_WAREHOUSE=WH_${{ inputs.project_code }}_TRANSFORM" >> "${GITHUB_ENV}"
          echo "DBT_DATABASE=${env_upper}_${{ inputs.project_code }}" >> "${GITHUB_ENV}"

      - name: Request account-scoped GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --get \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${SNOWFLAKE_OIDC_AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(jq -er '.value' <<<"${response}")"
          echo "::add-mask::${token}"
          echo "SNOWFLAKE_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Verify Snowflake workload identity
        shell: bash
        run: |
          snow sql --temporary-connection \
            --account "${SNOWFLAKE_ACCOUNT}" --user "${SNOWFLAKE_USER}" --role "${SNOWFLAKE_ROLE}" \
            --warehouse "${SNOWFLAKE_WAREHOUSE}" --database "${SNOWFLAKE_DATABASE}" \
            --authenticator WORKLOAD_IDENTITY --workload-identity-provider OIDC \
            --enable-templating NONE --local-only --enhanced-exit-codes \
            -q 'select current_database(), current_warehouse(), current_user(), current_role()'

      - name: Deploy committed domain control-plane SQL in manifest order
        shell: bash
        run: |
          set -euo pipefail
          manifest="project/control_plane/deploy_manifest.txt"
          if [[ ! -f "${manifest}" ]]; then
            echo "No domain control-plane manifest found; skipping."
            exit 0
          fi
          while IFS= read -r raw || [[ -n "${raw}" ]]; do
            path="${raw%%#*}"
            path="$(printf '%s' "${path}" | xargs)"
            [[ -z "${path}" ]] && continue
            echo "Applying ${path}"
            snow sql --temporary-connection \
              --account "${SNOWFLAKE_ACCOUNT}" --user "${SNOWFLAKE_USER}" --role "${SNOWFLAKE_ROLE}" \
              --warehouse "${SNOWFLAKE_WAREHOUSE}" --database "${SNOWFLAKE_DATABASE}" \
              --authenticator WORKLOAD_IDENTITY --workload-identity-provider OIDC \
              --enable-templating NONE --local-only --enhanced-exit-codes \
              -f "project/${path}"
          done < "${manifest}"

      - name: Deploy committed Silver SQL in manifest order
        shell: bash
        run: |
          set -euo pipefail
          manifest="project/silver_processing/deploy_manifest.txt"
          while IFS= read -r raw || [[ -n "${raw}" ]]; do
            path="${raw%%#*}"
            path="$(printf '%s' "${path}" | xargs)"
            [[ -z "${path}" ]] && continue
            echo "Applying ${path}"
            snow sql --temporary-connection \
              --account "${SNOWFLAKE_ACCOUNT}" --user "${SNOWFLAKE_USER}" --role "${SNOWFLAKE_ROLE}" \
              --warehouse "${SNOWFLAKE_WAREHOUSE}" --database "${SNOWFLAKE_DATABASE}" \
              --authenticator WORKLOAD_IDENTITY --workload-identity-provider OIDC \
              --enable-templating NONE --local-only --enhanced-exit-codes \
              -f "project/${path}"
          done < "${manifest}"

      - name: Verify dbt connection
        run: dbt debug --target "${{ inputs.environment }}" --project-dir "project/${{ inputs.project_dir }}" --profiles-dir "project/${{ inputs.project_dir }}"

      - name: Build Gold and Semantic models
        run: dbt build --target "${{ inputs.environment }}" --project-dir "project/${{ inputs.project_dir }}" --profiles-dir "project/${{ inputs.project_dir }}"
