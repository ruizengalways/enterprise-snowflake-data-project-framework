name: One-time patch-helper correction

on:
  push:
    branches: [fix/input-idempotency-hardening]
    paths: [.github/workflows/fix-patch-helper.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/input-idempotency-hardening
          fetch-depth: 0
      - name: Relax only the temporary marker uniqueness guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/patch-idempotency-026.yml')
          text = path.read_text(encoding='utf-8')
          old = '''              if text.count(old) != 1:\n                  raise SystemExit(f"expected one exact patch marker in {path}, found {text.count(old)}")\n              p.write_text(text.replace(old, new, 1), encoding="utf-8")'''
          new = '''              if old not in text:\n                  raise SystemExit(f"expected patch marker not found in {path}")\n              p.write_text(text.replace(old, new, 1), encoding="utf-8")'''
          if text.count(old) != 1:
              raise SystemExit('temporary helper marker changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-idempotency-026.yml
          git commit -m "build: relax temporary patch marker guard"
          git push origin HEAD:fix/input-idempotency-hardening
