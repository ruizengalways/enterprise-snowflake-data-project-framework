name: One-time idempotency hardening patch

on:
  push:
    branches: [fix/input-idempotency-hardening]
    paths: [.github/workflows/patch-idempotency-026.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/input-idempotency-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Apply narrow renderer patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one exact patch marker in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          apply = "src/enterprise_snowflake_framework/pipeline_apply.py"
          replay = "src/enterprise_snowflake_framework/pipeline_replay.py"

          replace_once(
              apply,
              "from typing import Any\n\nfrom .pipeline_model import (",
              "from typing import Any\n\nfrom .pipeline_idempotency import (\n"
              "    IDEMPOTENCY_DECLARATIONS,\n"
              "    render_deduped_relation,\n"
              "    render_idempotency_conflict_guard,\n"
              ")\nfrom .pipeline_model import (",
          )
          replace_once(
              apply,
              '''    extra_declarations = ""\n    if pattern == "scd2":\n        extra_declarations = """    V_EVENTS_INSERTED NUMBER DEFAULT 0;\n    V_EVENTS_INSERT_QUERY_ID VARCHAR;\n    V_HISTORY_ROWS_DELETED NUMBER DEFAULT 0;\n    V_HISTORY_DELETE_QUERY_ID VARCHAR;\n    V_HISTORY_ROWS_REBUILT NUMBER DEFAULT 0;\n    V_HISTORY_REBUILD_QUERY_ID VARCHAR;\n"""\n''',
              '''    extra_declarations = (\n        IDEMPOTENCY_DECLARATIONS if pattern in {"append", "scd2"} else ""\n    )\n    if pattern == "scd2":\n        extra_declarations += """    V_EVENTS_INSERTED NUMBER DEFAULT 0;\n    V_EVENTS_INSERT_QUERY_ID VARCHAR;\n    V_HISTORY_ROWS_DELETED NUMBER DEFAULT 0;\n    V_HISTORY_DELETE_QUERY_ID VARCHAR;\n    V_HISTORY_ROWS_REBUILT NUMBER DEFAULT 0;\n    V_HISTORY_REBUILD_QUERY_ID VARCHAR;\n"""\n''',
          )
          replace_once(
              apply,
              '''        new_defs = _column_defs(contract)\n        dedup = _join("T", "N", idempotency)\n        return f"""{header}    CREATE OR REPLACE PROCEDURE SCOPED TEMP TABLE ESF_NEW_EVENTS (\n''',
              '''        new_defs = _column_defs(contract)\n        dedup = _join("T", "N", idempotency)\n        conflict_guard = render_idempotency_conflict_guard(\n            "ESF_NEW_EVENTS",\n            identity_columns=idempotency,\n            payload_columns=columns,\n        )\n        deduped_input = render_deduped_relation(\n            "ESF_NEW_EVENTS",\n            identity_columns=idempotency,\n            payload_columns=columns,\n            output_alias="N",\n        )\n        return f"""{header}    CREATE OR REPLACE PROCEDURE SCOPED TEMP TABLE ESF_NEW_EVENTS (\n''',
          )
          replace_once(
              apply,
              '''        V_ROWS_READ := (SELECT COUNT(*) FROM ESF_NEW_EVENTS);\n        V_AFFECTED_BUSINESS_KEYS := {_distinct_business_keys('ESF_NEW_EVENTS', business_key)};\n''',
              '''        V_ROWS_READ := (SELECT COUNT(*) FROM ESF_NEW_EVENTS);\n{conflict_guard}        V_AFFECTED_BUSINESS_KEYS := {_distinct_business_keys('ESF_NEW_EVENTS', business_key)};\n''',
          )
          replace_once(
              apply,
              '''        FROM ESF_NEW_EVENTS N\n        WHERE NOT EXISTS (\n            SELECT 1\n            FROM {names.physical_relation} T\n''',
              '''        FROM {deduped_input}\n        WHERE NOT EXISTS (\n            SELECT 1\n            FROM {names.physical_relation} T\n''',
          )
          replace_once(
              apply,
              '''        new_defs = _column_defs(contract)\n        key_defs = _typed_defs(contract, business_key)\n        dedup = _join("E", "N", idempotency) + " AND E.ESF_STREAM_ACTION = N.ESF_STREAM_ACTION"\n        affected_events = _join("E", "K", business_key)\n''',
              '''        new_defs = _column_defs(contract)\n        key_defs = _typed_defs(contract, business_key)\n        event_identity = [*idempotency, "ESF_STREAM_ACTION"]\n        event_payload = [*columns, "ESF_STREAM_ACTION", "ESF_STREAM_ISUPDATE"]\n        dedup = _join("E", "N", idempotency) + " AND E.ESF_STREAM_ACTION = N.ESF_STREAM_ACTION"\n        conflict_guard = render_idempotency_conflict_guard(\n            "ESF_NEW_EVENTS",\n            identity_columns=event_identity,\n            payload_columns=event_payload,\n        )\n        deduped_input = render_deduped_relation(\n            "ESF_NEW_EVENTS",\n            identity_columns=event_identity,\n            payload_columns=event_payload,\n            output_alias="N",\n        )\n        affected_events = _join("E", "K", business_key)\n''',
          )
          replace_once(
              apply,
              '''        V_ROWS_READ := (SELECT COUNT(*) FROM ESF_NEW_EVENTS);\n        V_DATA_MAX_AT := (SELECT MAX({freshness}) FROM ESF_NEW_EVENTS);\n\n        INSERT INTO {names.events_relation} (\n''',
              '''        V_ROWS_READ := (SELECT COUNT(*) FROM ESF_NEW_EVENTS);\n        V_DATA_MAX_AT := (SELECT MAX({freshness}) FROM ESF_NEW_EVENTS);\n\n{conflict_guard}        INSERT INTO {names.events_relation} (\n''',
          )
          replace_once(
              apply,
              '''        FROM ESF_NEW_EVENTS N\n        WHERE NOT EXISTS (\n            SELECT 1\n            FROM {names.events_relation} E\n''',
              '''        FROM {deduped_input}\n        WHERE NOT EXISTS (\n            SELECT 1\n            FROM {names.events_relation} E\n''',
          )

          replace_once(
              replay,
              '''from .pipeline_model import (\n    PipelineNames,\n    _csv,\n''',
              '''from .pipeline_idempotency import (\n    IDEMPOTENCY_DECLARATIONS,\n    render_deduped_relation,\n    render_idempotency_conflict_guard,\n)\nfrom .pipeline_model import (\n    PipelineNames,\n    _column_defs,\n    _csv,\n''',
          )
          replace_once(
              replay,
              '''    columns = column_names(contract)\n    idempotency = [str(value).upper() for value in contract.get("idempotency_key", [])]\n    timestamp_column = _replay_timestamp(contract)\n    row_filter = _range_filter(timestamp_column)\n    dedup = _join("T", "B", idempotency)\n    return f"""-- Candidate append replay. Bronze remains the source of recovery evidence.\n''',
              '''    columns = column_names(contract)\n    idempotency = [str(value).upper() for value in contract.get("idempotency_key", [])]\n    timestamp_column = _replay_timestamp(contract)\n    row_filter = _range_filter(timestamp_column)\n    new_defs = _column_defs(contract)\n    dedup = _join("T", "N", idempotency)\n    conflict_guard = render_idempotency_conflict_guard(\n        "ESF_REPLAY_INPUT",\n        identity_columns=idempotency,\n        payload_columns=columns,\n    )\n    deduped_input = render_deduped_relation(\n        "ESF_REPLAY_INPUT",\n        identity_columns=idempotency,\n        payload_columns=columns,\n        output_alias="N",\n    )\n    return f"""-- Candidate append replay. Bronze remains the source of recovery evidence.\n''',
          )
          replace_once(
              replay,
              '''    V_ROWS_READ NUMBER DEFAULT 0;\n    V_ROWS_RECOVERED NUMBER DEFAULT 0;\nBEGIN\n{_range_guard(timestamp_column)}{_repair_start(names)}    BEGIN\n        BEGIN TRANSACTION;\n\n        IF (P_FROM IS NULL AND P_TO IS NULL) THEN\n''',
              '''    V_ROWS_READ NUMBER DEFAULT 0;\n    V_ROWS_RECOVERED NUMBER DEFAULT 0;\n{IDEMPOTENCY_DECLARATIONS}BEGIN\n{_range_guard(timestamp_column)}    CREATE OR REPLACE PROCEDURE SCOPED TEMP TABLE ESF_REPLAY_INPUT (\n{new_defs}\n    );\n\n    INSERT INTO ESF_REPLAY_INPUT ({_csv(columns)})\n    SELECT {_csv(columns, 'B')}\n    FROM {names.bronze_relation} B\n    WHERE {row_filter};\n\n    V_ROWS_READ := (SELECT COUNT(*) FROM ESF_REPLAY_INPUT);\n\n{_repair_start(names)}    BEGIN\n        BEGIN TRANSACTION;\n\n{conflict_guard}        IF (P_FROM IS NULL AND P_TO IS NULL) THEN\n''',
          )
          replace_once(
              replay,
              '''        V_ROWS_READ := (\n            SELECT COUNT(*)\n            FROM {names.bronze_relation} B\n            WHERE {row_filter}\n        );\n\n        INSERT INTO {names.physical_relation} ({_csv(columns)}, ESF_LOADED_AT)\n        SELECT {_csv(columns, 'B')}, CURRENT_TIMESTAMP()\n        FROM {names.bronze_relation} B\n        WHERE {row_filter}\n          AND NOT EXISTS (\n              SELECT 1\n              FROM {names.physical_relation} T\n              WHERE {dedup}\n          );\n''',
              '''        INSERT INTO {names.physical_relation} ({_csv(columns)}, ESF_LOADED_AT)\n        SELECT {_csv(columns, 'N')}, CURRENT_TIMESTAMP()\n        FROM {deduped_input}\n        WHERE NOT EXISTS (\n            SELECT 1\n            FROM {names.physical_relation} T\n            WHERE {dedup}\n        );\n''',
          )

          replace_once(
              replay,
              '''    dedup = _join("E", "B", idempotency) + f" AND E.ESF_STREAM_ACTION = {replay_action}"\n    affected_events = _join("E", "K", business_key)\n''',
              '''    event_identity = [*idempotency, "ESF_STREAM_ACTION"]\n    event_payload = [*columns, "ESF_STREAM_ACTION", "ESF_STREAM_ISUPDATE"]\n    new_defs = _column_defs(contract)\n    dedup = _join("E", "N", idempotency) + " AND E.ESF_STREAM_ACTION = N.ESF_STREAM_ACTION"\n    conflict_guard = render_idempotency_conflict_guard(\n        "ESF_REPLAY_INPUT",\n        identity_columns=event_identity,\n        payload_columns=event_payload,\n    )\n    deduped_input = render_deduped_relation(\n        "ESF_REPLAY_INPUT",\n        identity_columns=event_identity,\n        payload_columns=event_payload,\n        output_alias="N",\n    )\n    affected_events = _join("E", "K", business_key)\n''',
          )
          replace_once(
              replay,
              '''    V_ROWS_READ NUMBER DEFAULT 0;\n    V_ROWS_RECOVERED NUMBER DEFAULT 0;\nBEGIN\n    CREATE OR REPLACE PROCEDURE SCOPED TEMP TABLE ESF_AFFECTED_KEYS (\n{key_defs}\n    );\n\n{_repair_start(names)}    BEGIN\n        BEGIN TRANSACTION;\n\n        IF (P_FROM IS NULL AND P_TO IS NULL) THEN\n''',
              '''    V_ROWS_READ NUMBER DEFAULT 0;\n    V_ROWS_RECOVERED NUMBER DEFAULT 0;\n{IDEMPOTENCY_DECLARATIONS}BEGIN\n    CREATE OR REPLACE PROCEDURE SCOPED TEMP TABLE ESF_REPLAY_INPUT (\n{new_defs},\n        ESF_STREAM_ACTION VARCHAR NOT NULL,\n        ESF_STREAM_ISUPDATE BOOLEAN NOT NULL\n    );\n\n    CREATE OR REPLACE PROCEDURE SCOPED TEMP TABLE ESF_AFFECTED_KEYS (\n{key_defs}\n    );\n\n    INSERT INTO ESF_REPLAY_INPUT ({_csv(columns)}, ESF_STREAM_ACTION, ESF_STREAM_ISUPDATE)\n    SELECT {_csv(columns, 'B')}, {replay_action}, FALSE\n    FROM {names.bronze_relation} B\n    WHERE (:P_FROM IS NULL OR B.{source_timestamp} >= :P_FROM)\n      AND (:P_TO IS NULL OR B.{source_timestamp} < :P_TO);\n\n    V_ROWS_READ := (SELECT COUNT(*) FROM ESF_REPLAY_INPUT);\n\n{_repair_start(names)}    BEGIN\n        BEGIN TRANSACTION;\n\n{conflict_guard}        IF (P_FROM IS NULL AND P_TO IS NULL) THEN\n''',
          )
          replace_once(
              replay,
              '''        SELECT\n            {_csv(columns, 'B')},\n            {replay_action},\n            FALSE,\n            TO_VARCHAR(HASH({_csv(columns, 'B')}, {replay_action})),\n            CURRENT_TIMESTAMP()\n        FROM {names.bronze_relation} B\n        WHERE (:P_FROM IS NULL OR B.{source_timestamp} >= :P_FROM)\n          AND (:P_TO IS NULL OR B.{source_timestamp} < :P_TO)\n          AND NOT EXISTS (\n              SELECT 1\n              FROM {names.events_relation} E\n              WHERE {dedup}\n          );\n\n        V_ROWS_READ := SQLROWCOUNT;\n\n        INSERT INTO ESF_AFFECTED_KEYS ({_csv(business_key)})\n        SELECT DISTINCT {_csv(business_key, 'B')}\n        FROM {names.bronze_relation} B\n        WHERE (:P_FROM IS NULL OR B.{source_timestamp} >= :P_FROM)\n          AND (:P_TO IS NULL OR B.{source_timestamp} < :P_TO);\n''',
              '''        SELECT\n            {_csv(columns, 'N')},\n            N.ESF_STREAM_ACTION,\n            N.ESF_STREAM_ISUPDATE,\n            TO_VARCHAR(HASH({_csv(columns, 'N')}, N.ESF_STREAM_ACTION)),\n            CURRENT_TIMESTAMP()\n        FROM {deduped_input}\n        WHERE NOT EXISTS (\n            SELECT 1\n            FROM {names.events_relation} E\n            WHERE {dedup}\n        );\n\n        INSERT INTO ESF_AFFECTED_KEYS ({_csv(business_key)})\n        SELECT DISTINCT {_csv(business_key, 'B')}\n        FROM ESF_REPLAY_INPUT B;\n''',
          )
          PY

          python -m py_compile \
            src/enterprise_snowflake_framework/pipeline_idempotency.py \
            src/enterprise_snowflake_framework/pipeline_apply.py \
            src/enterprise_snowflake_framework/pipeline_replay.py
          python -m unittest tests.test_input_idempotency -v
      - name: Commit renderer changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/enterprise_snowflake_framework/pipeline_apply.py src/enterprise_snowflake_framework/pipeline_replay.py
          git commit -m "fix: harden incoming idempotency identity"
          git push origin HEAD:fix/input-idempotency-hardening
