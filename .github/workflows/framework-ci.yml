name: Silver-first Toolkit CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dbt.txt
      - run: |
          python -m pip install .
          python -m pip install -r requirements-dbt.txt

      - name: Protect released control migration templates
        if: github.event_name == 'pull_request'
        run: python scripts/check_released_control_migrations.py --base "${{ github.event.pull_request.base.sha }}"

      - name: Validate reference project
        run: esf validate --project-root examples/silver-first-project

      - name: Parse generated dbt observability starter
        shell: bash
        env:
          SNOWFLAKE_ACCOUNT: example-account
          SNOWFLAKE_USER: example-user
          DBT_ROLE: AR_CI_DEPLOY
          DBT_DATABASE: DEV_CI
          DBT_WAREHOUSE: WH_CI_TRANSFORM
          DBT_AUTHENTICATOR: externalbrowser
        run: |
          set -euo pipefail
          root="$(mktemp -d)/enterprise-snowflake-ci-analytics"
          esf init-project --project-root "${root}"
          dbt parse --project-dir "${root}/dbt" --profiles-dir "${root}/dbt"

      - name: Test toolkit and reusable workflows
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Keep runtime indirection out of the toolkit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dbt_package
          test ! -e project_schema
          test ! -e src/enterprise_snowflake_framework/dataset_metadata.py
          test ! -e src/enterprise_snowflake_framework/dbt_context.py
          test ! -e src/enterprise_snowflake_framework/dbt_vars.py
          test ! -e src/enterprise_snowflake_framework/scd2_validation.py
          test ! -e src/enterprise_snowflake_framework/config_snapshot.py
          if grep -R -n -E 'esf_apply_dataset_config|esf_scd1_current|esf_scd2_history|materialization\.type|runtime\.mode' src examples/silver-first-project; then
            echo 'Runtime/dbt abstraction leaked back into the Silver-first toolkit.' >&2
            exit 1
          fi
          grep -Fq 'affected business keys' src/enterprise_snowflake_framework/templates/scd2/README.md
          grep -Fq 'Do not replace this with a shared runtime macro' src/enterprise_snowflake_framework/templates/append/010_apply.sql
          grep -Fq 'dbt starts from trusted Silver' README.md
          grep -Fq 'silver_processing/deploy_manifest.txt' .github/workflows/project-deploy.yml
          grep -Fq 'esf_record_dbt_results(results)' src/enterprise_snowflake_framework/templates/project/dbt_project.yml
          grep -Fq 'CONTROL.BEGIN_INGESTION_RUN' src/enterprise_snowflake_framework/templates/project/control_plane_060_run_evidence_api.sql
          grep -Fq 'esf-migrate deploy' .github/workflows/project-deploy.yml

# This workflow is intentionally credential-free for pull requests. Real Snowflake execution is
# isolated in .github/workflows/snowflake-certification.yml and only uses a trusted main revision.
