name: Framework v2 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: v2 contracts and stateful behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: Level 1 - metadata schema validation
        run: python validation/validate_metadata.py --project-root examples/mixed-strategy-project
      - name: Level 3 - focused SCD2 behavior oracle
        run: |
          python -m unittest discover -s tests -p 'test_clean_v2_contract.py' -v
          python -m unittest discover -s tests -p 'test_scd2_behavior_oracle.py' -v
      - name: Level 4 - static Snowflake and architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'load_strategy|scd1_merge|scd2_merge|scd2_snapshot|scd2_stream_task|legacy_dataset_view|_V1_STRATEGY_MAP' project_schema src dbt_package examples/mixed-strategy-project; then
            echo 'Legacy API found in active v2 code.' >&2
            exit 1
          fi
          test ! -e dbt_package/macros/capture
          test ! -e dbt_package/macros/loading
          test ! -e dbt_package/macros/scd
          grep -Fq 'merge into' dbt_package/materializations/esf_scd1_current.sql
          grep -Fq 'then delete' dbt_package/materializations/esf_scd1_current.sql
          FILE=dbt_package/materializations/esf_scd2_history.sql
          grep -Fq 'row_number() over' "$FILE"
          grep -Fq 'lag(_esf_record_hash)' "$FILE"
          grep -Fq 'lead(' "$FILE"
          grep -Fq 'valid_from' "$FILE"
          grep -Fq 'valid_to' "$FILE"
          grep -Fq 'is_current' "$FILE"
          grep -Fq 'version_order' "$FILE"
          grep -Fq 'copy grants' "$FILE"
          grep -Fq "where is_current = true" examples/mixed-strategy-project/dbt/models/silver/historical_entity_current.sql
          if grep -Fq 'is_current' examples/mixed-strategy-project/dbt/models/gold/gold_aggregation.sql; then exit 1; fi
          if grep -R -n -E 'merge into PLATFORM_CONTROL|update PLATFORM_CONTROL|insert into PLATFORM_CONTROL|delete from PLATFORM_CONTROL' dbt_package/macros; then exit 1; fi

  dbt-offline:
    name: Level 2 - dbt parse and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dbt.txt
      - run: |
          python -m pip install -r requirements-dbt.txt
          python -m pip install -e .
      - name: Parse all mixed strategies together
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=examples/mixed-strategy-project
          DBT_PROJECT=$PROJECT/dbt
          VARS="$(python scripts/render_dbt_vars.py --project-root "$PROJECT")"
          dbt deps --project-dir "$DBT_PROJECT" --profiles-dir "$DBT_PROJECT"
          dbt parse --no-partial-parse --project-dir "$DBT_PROJECT" --profiles-dir "$DBT_PROJECT" --vars "$VARS"
          dbt compile --no-introspect --project-dir "$DBT_PROJECT" --profiles-dir "$DBT_PROJECT" --vars "$VARS"
      - name: Assert materialization routing in manifest
        shell: bash
        run: |
          set -euo pipefail
          M=examples/mixed-strategy-project/dbt/target/manifest.json
          jq -e '.nodes | to_entries | any(.value.name == "reference_table" and .value.config.materialized == "table")' "$M" >/dev/null
          jq -e '.nodes | to_entries | any(.value.name == "events" and .value.config.materialized == "incremental")' "$M" >/dev/null
          jq -e '.nodes | to_entries | any(.value.name == "current_entity" and .value.config.materialized == "incremental")' "$M" >/dev/null
          jq -e '.nodes | to_entries | any(.value.name == "patient" and .value.config.materialized == "esf_scd1_current")' "$M" >/dev/null
          jq -e '.nodes | to_entries | any(.value.name == "historical_entity_history" and .value.config.materialized == "esf_scd2_history")' "$M" >/dev/null
          jq -e '.nodes | to_entries | any(.value.name == "historical_entity_current" and .value.config.materialized == "view")' "$M" >/dev/null
          jq -e '.nodes | to_entries | any(.value.name == "gold_aggregation" and .value.config.materialized == "dynamic_table")' "$M" >/dev/null

# Level 5 remains separate: live WIF acceptance only when Snowflake is actually configured.
