name: Framework CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python utilities and metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install framework
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate metadata and execution utilities
        run: |
          python validation/validate_metadata.py --project-root examples/minimal-project
          python scripts/render_dbt_vars.py --project-root examples/minimal-project
          python scripts/render_workspace_sql.py \
            --kind pr --action create --database CI_HEALTH --pr-number 123 \
            --layers staging marts
          python scripts/render_query_tag.py \
            --project health --environment ci --workload pr_ci \
            --dataset patient --pr-number 123 \
            --run-id "${GITHUB_RUN_ID}" --git-sha "${GITHUB_SHA}" --as-sql
          python scripts/resolve_dbt_target.py \
            --project-code HEALTH --environment ci --workload ci --pr-number 123

  dbt-smoke:
    name: dbt 1.12 native Snowflake and SCD contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dbt.txt

      - name: Install pinned dbt and framework
        run: |
          python -m pip install -r requirements-dbt.txt
          python -m pip install -e .

      - name: Resolve CI target
        run: |
          python scripts/resolve_dbt_target.py \
            --project-code HEALTH --environment ci --workload ci --pr-number 123 \
            --format env >> "$GITHUB_ENV"

      - name: Parse offline
        run: |
          dbt deps --project-dir examples/dbt-smoke --profiles-dir examples/dbt-smoke
          dbt parse --no-partial-parse \
            --project-dir examples/dbt-smoke --profiles-dir examples/dbt-smoke

      - name: Assert model routing and standard loads
        run: |
          MANIFEST=examples/dbt-smoke/target/manifest.json
          python scripts/assert_dbt_manifest.py \
            --manifest "$MANIFEST" --model example \
            --database CI_HEALTH --schema PR_123_STAGING
          python scripts/assert_dbt_manifest.py \
            --manifest "$MANIFEST" --model smoke_full_refresh \
            --database CI_HEALTH --schema PR_123_STAGING --materialized table
          python scripts/assert_dbt_manifest.py \
            --manifest "$MANIFEST" --model smoke_append_only \
            --database CI_HEALTH --schema PR_123_STAGING \
            --materialized incremental --incremental-strategy append
          python scripts/assert_dbt_manifest.py \
            --manifest "$MANIFEST" --model smoke_incremental_merge \
            --database CI_HEALTH --schema PR_123_STAGING \
            --materialized incremental --incremental-strategy merge --unique-key id
          python scripts/assert_dbt_manifest.py \
            --manifest "$MANIFEST" --model smoke_capture_merge \
            --database CI_HEALTH --schema PR_123_STAGING \
            --pre-hook-contains "when matched and source"
          python scripts/assert_dbt_manifest.py \
            --manifest "$MANIFEST" --model smoke_capture_dynamic_table \
            --database CI_HEALTH --schema PR_123_STAGING \
            --pre-hook-contains "refresh_mode = INCREMENTAL"

      - name: Render framework SQL without connecting to Snowflake
        run: |
          dbt run-operation smoke_capture_sql \
            --project-dir examples/dbt-smoke \
            --profiles-dir examples/dbt-smoke \
            | tee "${RUNNER_TEMP}/capture-render.txt"
          dbt run-operation smoke_scd2_behavior_fixture_sql \
            --project-dir examples/dbt-smoke \
            --profiles-dir examples/dbt-smoke \
            | tee "${RUNNER_TEMP}/scd2-behavior-render.txt"

      - name: Assert Snowflake-native capture and orchestration
        shell: bash
        run: |
          set -euo pipefail
          FILE="${RUNNER_TEMP}/capture-render.txt"
          grep -qi "'INSERT' as _esf_change_type" "$FILE"
          grep -qi "'UPDATE' as _esf_change_type" "$FILE"
          grep -qi "'DELETE' as _esf_change_type" "$FILE"
          grep -qi "create stream if not exists CI_HEALTH.PR_123_STAGING.PATIENT_CURRENT_STREAM" "$FILE"
          grep -qi "append_only = false" "$FILE"
          grep -qi "create stream if not exists CI_HEALTH.PR_123_STAGING.PATIENT_EVENT_STREAM" "$FILE"
          grep -qi "append_only = true" "$FILE"
          grep -qi "show_initial_rows = false" "$FILE"
          if grep -qi "create or alter stream CI_HEALTH.PR_123_STAGING.PATIENT_EVENT_STREAM" "$FILE"; then
            echo "Routine deployment must not ALTER/replace an offset-bearing Stream." >&2
            exit 1
          fi
          grep -qi "create or alter task CI_HEALTH.PR_123_STAGING.PROCESS_PATIENT_EVENT" "$FILE"
          grep -qi "system\$stream_has_data('CI_HEALTH.PR_123_STAGING.PATIENT_EVENT_STREAM')" "$FILE"
          grep -qi "task_auto_retry_attempts = 1" "$FILE"
          grep -qi "suspend_task_after_num_failures = 3" "$FILE"
          grep -qi "overlap_policy = NO_OVERLAP" "$FILE"
          grep -qi "information_schema.task_history" "$FILE"
          grep -qi "information_schema.complete_task_graphs" "$FILE"

      - name: Assert native quality and bounded custom state
        shell: bash
        run: |
          set -euo pipefail
          FILE="${RUNNER_TEMP}/capture-render.txt"
          grep -qi "data_metric_schedule = 'TRIGGER_ON_CHANGES'" "$FILE"
          grep -qi "snowflake.core.freshness" "$FILE"
          grep -qi "expectation freshness_warn (value <= 3600)" "$FILE"
          grep -qi "freshness_error (value <= 7200)" "$FILE"
          grep -qi "snowflake.local.data_quality_monitoring_expectation_status" "$FILE"
          grep -qi "count(distinct" "$FILE"
          grep -qi "min_source_timestamp" "$FILE"
          grep -qi "max_source_timestamp" "$FILE"
          grep -qi "from PLATFORM_CONTROL.OPERATIONS.PIPELINE_CHECKPOINT" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.ADVANCE_PIPELINE_CHECKPOINT" "$FILE"
          grep -qi "merge into PLATFORM_CONTROL.OPERATIONS.PIPELINE_RUN" "$FILE"
          grep -qi "'RUNNING' as status" "$FILE"
          grep -qi "status = 'SUCCEEDED'" "$FILE"

      - name: Assert SCD native split and correctness SQL
        shell: bash
        run: |
          set -euo pipefail
          FILE="${RUNNER_TEMP}/capture-render.txt"
          grep -qi "create or alter dynamic table CI_HEALTH.PR_123_CANONICAL.PATIENT_CURRENT_DT" "$FILE"
          grep -qi "refresh_mode = ADAPTIVE" "$FILE"
          grep -qi "merge into CI_HEALTH.PR_123_CANONICAL.PATIENT_CURRENT" "$FILE"
          grep -qi "_esf_version_ordinal" "$FILE"
          grep -qi "lead(\"source_updated_at\")" "$FILE"
          grep -qi "update CI_HEALTH.PR_123_CANONICAL.PATIENT_SNAPSHOT_HISTORY" "$FILE"
          grep -qi "_esf_is_current = false" "$FILE"
          grep -qi "create or alter task CI_HEALTH.PR_123_CANONICAL.PROCESS_PATIENT_HISTORY" "$FILE"
          grep -qi "delete from CI_HEALTH.PR_123_CANONICAL.PATIENT_HISTORY" "$FILE"
          grep -qi "from CI_HEALTH.PR_123_STAGING.PATIENT_EVENT_STREAM" "$FILE"
          grep -qi "begin transaction" "$FILE"
          grep -qi "rollback" "$FILE"
          grep -qi "raise" "$FILE"
          if grep -qi "insert overwrite into CI_HEALTH.PR_123_STAGING.PATIENT_AFFECTED_KEYS" "$FILE"; then
            echo "Stream SCD2 must use repeatable Stream reads, not a shared affected-key work table." >&2
            exit 1
          fi

      - name: Assert deterministic SCD2 behavior oracle
        shell: bash
        run: |
          set -euo pipefail
          FILE="${RUNNER_TEMP}/scd2-behavior-render.txt"
          grep -qi -- "---SCD2_BEHAVIOR_FIXTURE---" "$FILE"
          grep -qi "from values" "$FILE"
          grep -qi "alpha-v1" "$FILE"
          grep -qi "bravo-v2" "$FILE"
          grep -qi "charlie-v2" "$FILE"
          grep -qi "lead(\"source_updated_at\")" "$FILE"
          grep -qi "minus" "$FILE"
          grep -qi "MISSING_EXPECTED" "$FILE"
          grep -qi "UNEXPECTED_ACTUAL" "$FILE"
          grep -qi "union all by name" "$FILE"
          grep -Eqi "\)[[:space:]]+as events" "$FILE"
          if grep -Eqi "as fixture[[:space:]]+as events" "$FILE"; then
            echo "Fixture relation must not carry an alias before the SCD macro adds AS events." >&2
            exit 1
          fi
          # Delete boundaries participate in ordering even though tombstones are
          # not materialized as target history rows, so A's reinsert is ordinal 4.
          grep -Eqi "\('A',[[:space:]]*'a3',[[:space:]]*50,.*true,[[:space:]]*4\)" "$FILE"
