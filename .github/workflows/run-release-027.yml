name: One-time 0.27 release patch

on:
  push:
    branches: [fix/scd2-replay-event-identity]
    paths: [.github/workflows/run-release-027.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/scd2-replay-event-identity
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install .
      - name: Patch release identity and verify focused contracts
        run: |
          set -euo pipefail
          python tools/patch_release_027.py
          PYTHONPATH=src python -m unittest \
            tests.test_input_idempotency \
            tests.test_template_provenance_upgrade_plan \
            tests.test_task_operational_config -v
      - name: Commit formal release files only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/enterprise_snowflake_framework/template_provenance.py \
            tests/test_task_operational_config.py
          git commit -m "chore: register SCD2 template revision four"
          git push origin HEAD:fix/scd2-replay-event-identity
