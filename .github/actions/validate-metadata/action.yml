name: Validate Enterprise Snowflake Contracts
description: Validate project identity, RAW contracts, and explicit Silver pipeline contracts.

inputs:
  project-root:
    description: Project root relative to the caller workspace.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.13"

    - name: Install pinned toolkit
      shell: bash
      run: |
        FRAMEWORK_ROOT="$(cd "${GITHUB_ACTION_PATH}/../../.." && pwd)"
        python -m pip install "${FRAMEWORK_ROOT}"

    - name: Validate contracts
      shell: bash
      run: esf validate --project-root "${GITHUB_WORKSPACE}/${{ inputs.project-root }}"
